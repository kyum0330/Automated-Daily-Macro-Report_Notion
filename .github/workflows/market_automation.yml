name: Automated Daily Macro Report (Twice a Day)

on:
  schedule:
    # 1회차 실행: UTC 07:00 -> 한국 시간(KST) 오후 16:00 (국내 장 마감 후 즉시 반영)
    # 2회차 실행: UTC 21:00 -> 한국 시간(KST) 다음날 오전 06:00 (미국 장 마감 후 덮어쓰기 갱신)
    # 월요일 오후 16시부터 토요일 오전 6시까지 실시간 순환 가동됩니다.
    - cron: '0 7,21 * * 1-5'
  workflow_dispatch: # 언제든 수동으로 즉시 동기화할 수 있는 버튼 활성화

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install notion-client yfinance feedparser beautifulsoup4

    - name: Run Macro Report Script
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      run: python market_planner.py
